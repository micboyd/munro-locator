<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
	<!-- Email -->
	<div class="space-y-1.5">
		<label class="text-xs font-semibold uppercase tracking-wide text-neutral-400">Email</label>
		<div class="relative">
			<span class="pointer-events-none absolute inset-y-0 left-4 grid place-items-center text-neutral-300">
				<i class="fa-solid fa-envelope text-sm"></i>
			</span>
			<input class="w-full rounded-xl border bg-neutral-50 py-2.5 pl-11 pr-4 text-sm text-neutral-900 placeholder-neutral-400 outline-none transition-all duration-150 focus:bg-white focus:ring-2"
				[ngClass]="isInvalid('username') ? 'border-red-400 focus:border-red-400 focus:ring-red-400/10' : 'border-neutral-200 focus:border-neutral-400 focus:ring-neutral-200'"
				placeholder="you@example.com" formControlName="username" type="email" />
		</div>
		@if (isInvalid('username')) {
		<p class="text-xs text-red-500">Please enter a valid email address.</p>
		}
	</div>

	<!-- Password -->
	<div class="space-y-1.5">
		<label class="text-xs font-semibold uppercase tracking-wide text-neutral-400">Password</label>
		<div class="relative">
			<span class="pointer-events-none absolute inset-y-0 left-4 grid place-items-center text-neutral-300">
				<i class="fa-solid fa-lock text-sm"></i>
			</span>
			<input class="w-full rounded-xl border bg-neutral-50 py-2.5 pl-11 pr-4 text-sm text-neutral-900 placeholder-neutral-400 outline-none transition-all duration-150 focus:bg-white focus:ring-2"
				[ngClass]="isInvalid('password') ? 'border-red-400 focus:border-red-400 focus:ring-red-400/10' : 'border-neutral-200 focus:border-neutral-400 focus:ring-neutral-200'"
				placeholder="••••••••" formControlName="password" type="password" />
		</div>
		@if (isInvalid('password')) {
		<p class="text-xs text-red-500">Password is required.</p>
		}
	</div>

	<!-- Login error -->
	@if (loginErrorMessage) {
	<div class="rounded-xl bg-red-50 border border-red-100 p-3.5 text-xs font-semibold text-red-600">
		{{ loginErrorMessage }}
	</div>
	}

	<!-- Actions -->
	<div class="flex items-center justify-between">
		<label class="inline-flex items-center gap-2 text-xs font-semibold text-neutral-500">
			<input type="checkbox" class="h-4 w-4 rounded border-neutral-300 text-neutral-950 focus:ring-neutral-200" />
			Remember me
		</label>

		<a href="#" class="text-xs font-semibold text-neutral-500 hover:text-neutral-900 hover:underline">
			Forgot password?
		</a>
	</div>

	<!-- Submit -->
	<div class="pb-2">
	<button type="submit" [disabled]="!canSubmit" [ngClass]="{ 'opacity-50 cursor-not-allowed': !canSubmit }"
		class="w-full rounded-full bg-neutral-950 px-6 py-3 text-sm font-semibold text-white transition-colors duration-150 hover:bg-neutral-800 flex items-center justify-center">
		@if (loginLoading) {
		<app-loading-indicator [spinner]="true"></app-loading-indicator>
		} @else {
		<span class="inline-flex items-center gap-2">
			Sign in
			<i class="fa-solid fa-arrow-right text-xs"></i>
		</span>
		}
	</button>
	</div>
</form>
