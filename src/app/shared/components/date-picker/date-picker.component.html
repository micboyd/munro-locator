<div class="relative">

    <!-- Trigger -->
    <button type="button" (click)="toggle()"
        [disabled]="isDisabled"
        class="group flex w-full items-center gap-3 rounded-xl border bg-neutral-50 py-2.5 pl-4 pr-3 text-sm outline-none transition-all duration-150"
        [class.border-neutral-400]="isOpen"
        [class.bg-white]="isOpen"
        [class.ring-2]="isOpen"
        [class.ring-neutral-200]="isOpen"
        [class.border-neutral-200]="!isOpen"
        [class.cursor-not-allowed]="isDisabled"
        [class.opacity-50]="isDisabled"
        [class.cursor-pointer]="!isDisabled"
        [class.hover:border-neutral-300]="!isOpen && !isDisabled"
        [class.hover:bg-white]="!isOpen && !isDisabled">

        <i class="fa-regular fa-calendar shrink-0 text-sm text-neutral-400"></i>

        <span class="flex-1 text-left"
            [class.font-semibold]="hasValue"
            [class.text-neutral-900]="hasValue"
            [class.font-normal]="!hasValue"
            [class.text-neutral-400]="!hasValue">
            {{ hasValue ? triggerLabel : placeholder }}
        </span>

        @if (hasValue && !isDisabled) {
        <span (click)="clearValue($event)"
            class="grid h-5 w-5 shrink-0 place-items-center rounded-full text-neutral-300 transition-colors duration-150 hover:bg-neutral-200 hover:text-neutral-600">
            <i class="fa-solid fa-xmark text-[10px]"></i>
        </span>
        } @else {
        <i class="fa-solid fa-chevron-down shrink-0 text-[10px] text-neutral-300 transition-transform duration-200"
            [class.rotate-180]="isOpen"></i>
        }
    </button>

    <!-- Dropdown -->
    @if (isOpen) {
    <div class="absolute left-0 top-full z-50 mt-2 rounded-2xl border border-neutral-100 bg-white p-4 shadow-xl"
        [class.w-72]="!isRangeMode"
        [class.w-80]="isRangeMode"
        (click)="$event.stopPropagation()">

        <!-- Month nav -->
        <div class="mb-3 flex items-center justify-between">
            <button type="button" (click)="prevMonth($event)"
                class="grid h-8 w-8 place-items-center rounded-full border border-neutral-200 text-neutral-500 transition-colors duration-150 hover:border-neutral-300 hover:bg-neutral-50">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <span class="text-sm font-bold text-neutral-900">{{ monthLabel }}</span>
            <button type="button" (click)="nextMonth($event)"
                class="grid h-8 w-8 place-items-center rounded-full border border-neutral-200 text-neutral-500 transition-colors duration-150 hover:border-neutral-300 hover:bg-neutral-50">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Range hint -->
        @if (isRangeMode) {
        <p class="mb-3 text-center text-[11px] font-medium text-neutral-400">{{ rangeHint }}</p>
        }

        <!-- Weekday headers -->
        <div class="mb-1 grid grid-cols-7">
            @for (d of weekDays; track d) {
            <div class="py-1 text-center text-[10px] font-semibold uppercase tracking-widest text-neutral-400">
                {{ d }}
            </div>
            }
        </div>

        <!-- Day grid -->
        <div class="grid grid-cols-7" (mouseleave)="onCalendarLeave()">
            @for (day of calendarDays; track day.date) {
            <div class="relative flex h-9 items-center justify-center">

                <!-- Range background: left half -->
                @if (isRangeMode) {
                <div class="pointer-events-none absolute bottom-0.5 left-0 right-1/2 top-0.5 transition-colors duration-75"
                    [class.bg-neutral-100]="showLeftBg(day)"></div>

                <!-- Range background: right half -->
                <div class="pointer-events-none absolute bottom-0.5 left-1/2 right-0 top-0.5 transition-colors duration-75"
                    [class.bg-neutral-100]="showRightBg(day)"></div>
                }

                <button type="button"
                    (click)="selectDate($event, day)"
                    (mouseenter)="onDayHover(day)"
                    [class]="dayClass(day)">
                    {{ day.date.getDate() }}
                </button>

            </div>
            }
        </div>

    </div>
    }

</div>
