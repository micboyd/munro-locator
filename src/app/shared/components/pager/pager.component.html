@if (pagination?.totalPages > 1) {
<div class="my-12 flex justify-center">
    <nav class="flex items-center gap-2">

        <!-- Prev -->
        <button type="button" (click)="prev()" [disabled]="!pagination?.hasPrevPage"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-neutral-200 bg-white text-neutral-600 transition-all duration-150 hover:border-neutral-300 hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-chevron-left text-sm"></i>
        </button>

        @for (item of items; track item) {
        @if (item === 'dots') {
        <span class="inline-flex h-11 w-11 items-center justify-center text-neutral-400">
            <i class="fa-solid fa-ellipsis"></i>
        </span>
        } @else {
        <button type="button" (click)="goTo(item)"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full text-base font-semibold transition-all duration-150 cursor-pointer"
            [class.bg-neutral-900]="item === pagination.page"
            [class.text-white]="item === pagination.page"
            [class.border]="item !== pagination.page"
            [class.border-neutral-200]="item !== pagination.page"
            [class.bg-white]="item !== pagination.page"
            [class.text-neutral-600]="item !== pagination.page"
            [class.hover:bg-neutral-50]="item !== pagination.page">
            {{ item }}
        </button>
        }
        }

        <!-- Next -->
        <button type="button" (click)="next()" [disabled]="!pagination?.hasNextPage"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-neutral-200 bg-white text-neutral-600 transition-all duration-150 hover:border-neutral-300 hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-chevron-right text-sm"></i>
        </button>

    </nav>
</div>
}
