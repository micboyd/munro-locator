<div class="relative mb-6 sm:mb-8">
    <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-sm"></i>
    <input id="search" type="text" [formControl]="searchControl" placeholder="Search mountains…"
        class="w-full rounded-full border border-neutral-200 bg-white py-3 pl-12 pr-10 text-sm text-neutral-900 placeholder:text-neutral-400 outline-none transition-all duration-150 focus:border-neutral-400 focus:ring-2 focus:ring-neutral-200 hover:border-neutral-300 sm:py-3.5" />
    @if ((searchControl.value ?? '').length) {
    <button type="button" (click)="searchControl.setValue('')" aria-label="Clear search"
        class="absolute right-3 top-1/2 -translate-y-1/2 grid h-7 w-7 place-items-center rounded-full bg-neutral-100 text-neutral-500 transition-colors duration-150 hover:bg-neutral-200 hover:text-neutral-900">
        <i class="fa-solid fa-xmark text-xs"></i>
    </button>
    }
</div>
