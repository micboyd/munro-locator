<div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

    <!-- Left: sort + map -->
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center">

        <!-- Sort -->
        <div class="relative">
            <i class="fa-solid fa-arrow-up-wide-short pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"></i>
            <select [value]="sortValue" (change)="sortChange.emit(sortSelect.value)" #sortSelect
                class="w-full sm:w-56 appearance-none rounded-full border border-neutral-200 bg-white pl-10 pr-8 py-2.5 text-sm font-medium text-neutral-700 transition-colors duration-150 hover:border-neutral-300 focus:outline-none focus:ring-2 focus:ring-neutral-200 cursor-pointer">
                @for (option of sortOptions; track option.value) {
                    <option [value]="option.value">{{ option.label }}</option>
                }
            </select>
            <i class="fa-solid fa-chevron-down pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-neutral-400 text-xs"></i>
        </div>

        <!-- Map button -->
        @if (showMap) {
        <button (click)="mapClick.emit()"
            class="inline-flex items-center justify-center gap-2 rounded-full border border-neutral-200 bg-white px-4 py-2.5 text-sm font-medium text-neutral-700 transition-colors duration-150 hover:border-neutral-300 hover:bg-neutral-50">
            <i class="fa-solid fa-map-location-dot text-neutral-400 text-xs"></i>
            Map
        </button>
        }

    </div>

    <!-- Right: total count -->
    <div class="inline-flex items-center gap-2 rounded-full bg-neutral-100 px-4 py-2.5 text-sm font-medium text-neutral-500" aria-live="polite">
        <i class="fa-solid fa-mountain text-neutral-400 text-xs"></i>
        <span class="font-bold tabular-nums text-neutral-900">{{ total }}</span>
        <span>mountains</span>
    </div>

</div>

<app-search (searchTerm)="searchChange.emit($event)"></app-search>
