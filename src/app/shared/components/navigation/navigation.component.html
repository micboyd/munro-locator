<div class="sticky top-0 z-40 border-b border-neutral-200 bg-white/95 backdrop-blur-sm">
    <div class="mx-auto max-w-7xl px-6 sm:px-8">
        <nav class="flex h-20 items-center justify-between">

            <!-- Brand -->
            <a routerLink="/dashboard/board"
                class="flex items-center gap-3 shrink-0">
                <span class="grid h-10 w-10 place-items-center rounded-xl bg-[#013D5A] text-white">
                    <i class="fa-solid fa-mountain-sun"></i>
                </span>
                <span class="hidden text-base font-bold tracking-tight text-neutral-900 sm:block">Munro Manager</span>
            </a>

            <!-- Desktop nav links -->
            <div class="hidden items-center md:flex">
                <a routerLink="/dashboard/board" routerLinkActive="nav-link-active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="border-b-2 border-transparent px-6 pt-1 pb-[calc(0.375rem+2px)] text-base font-medium text-neutral-500 transition-colors duration-150 hover:text-neutral-900">
                    Board
                </a>
                <a routerLink="/dashboard/library" routerLinkActive="nav-link-active"
                    [routerLinkActiveOptions]="{ exact: true }"
                    class="border-b-2 border-transparent px-6 pt-1 pb-[calc(0.375rem+2px)] text-base font-medium text-neutral-500 transition-colors duration-150 hover:text-neutral-900">
                    Library
                </a>
            </div>

            <!-- Right: Profile + Mobile toggle -->
            <div class="flex items-center gap-3 shrink-0">
                @if (!profileLoading && profile) {
                <a routerLink="/dashboard/profile"
                    class="flex items-center gap-3 rounded-full border border-neutral-200 bg-white px-3 py-2 transition-all duration-200 hover:border-neutral-300 hover:shadow-sm"
                    aria-label="Open profile">
                    <img [src]="profile.profileImage" alt="Profile"
                        class="h-8 w-8 rounded-full object-cover" />
                    <span class="hidden pr-1 md:block text-base font-semibold text-neutral-800">{{ profile.firstName }}</span>
                </a>
                }

                <!-- Mobile menu button -->
                <button (click)="toggleMobile()"
                    class="grid h-10 w-10 place-items-center rounded-full border border-neutral-200 bg-white text-neutral-600 transition-all duration-200 hover:bg-neutral-50 md:hidden"
                    aria-label="Open menu">
                    <i class="fa-solid text-sm" [class.fa-bars]="!mobileOpen" [class.fa-xmark]="mobileOpen"></i>
                </button>
            </div>
        </nav>
    </div>

    <!-- Mobile menu -->
    @if (mobileOpen) {
    <div class="border-t border-neutral-100 bg-white md:hidden">
        <div class="mx-auto max-w-7xl px-6 py-4 sm:px-8">
            <div class="flex flex-col gap-1">
                <a routerLink="/dashboard/board" routerLinkActive="bg-neutral-100 text-neutral-900 font-semibold"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMobile()"
                    class="rounded-xl px-4 py-3.5 text-base font-medium text-neutral-600 transition-colors duration-150 hover:bg-neutral-50 hover:text-neutral-900">
                    Board
                </a>
                <a routerLink="/dashboard/library" routerLinkActive="bg-neutral-100 text-neutral-900 font-semibold"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMobile()"
                    class="rounded-xl px-4 py-3.5 text-base font-medium text-neutral-600 transition-colors duration-150 hover:bg-neutral-50 hover:text-neutral-900">
                    Library
                </a>
                <a routerLink="/dashboard/profile" routerLinkActive="bg-neutral-100 text-neutral-900 font-semibold"
                    [routerLinkActiveOptions]="{ exact: true }"
                    (click)="closeMobile()"
                    class="rounded-xl px-4 py-3.5 text-base font-medium text-neutral-600 transition-colors duration-150 hover:bg-neutral-50 hover:text-neutral-900">
                    Profile
                </a>
            </div>

            @if (!profileLoading && profile) {
            <div class="mt-3 flex items-center gap-3 rounded-2xl bg-neutral-50 p-4">
                <img [src]="profile.profileImage" alt="Profile"
                    class="h-10 w-10 rounded-full object-cover shrink-0" />
                <div class="min-w-0">
                    <div class="truncate text-base font-semibold text-neutral-900">{{ profile.firstName }} {{ profile.lastName }}</div>
                </div>
            </div>
            }
        </div>
    </div>
    }
</div>
