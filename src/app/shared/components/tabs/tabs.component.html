<div class="mb-6 sm:mb-8">
    <div class="inline-flex gap-1 rounded-full bg-neutral-100 p-1">
        @for (tab of tabs; track tab) {
        <button type="button" (click)="setActive(tab)"
            class="rounded-full px-3 py-2 text-xs font-semibold transition-all duration-200 whitespace-nowrap sm:px-5 sm:text-sm"
            [class.bg-white]="tab === activeTab"
            [class.text-neutral-900]="tab === activeTab"
            [class.shadow-sm]="tab === activeTab"
            [class.text-neutral-500]="tab !== activeTab">
            {{ tab }}
        </button>
        }
    </div>
</div>
