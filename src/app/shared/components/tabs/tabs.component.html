<div class="border-b border-neutral-200 mb-10">
    <nav class="-mb-px flex gap-0">
        @for (tab of tabs; track tab) {
        <button type="button" (click)="setActive(tab)"
            class="px-6 py-4 text-base font-semibold border-b-2 transition-colors duration-150 cursor-pointer whitespace-nowrap"
            [class.border-brand]="tab === activeTab"
            [class.text-brand]="tab === activeTab"
            [class.border-transparent]="tab !== activeTab"
            [class.text-neutral-500]="tab !== activeTab">
            {{ tab }}
        </button>
        }
    </nav>
</div>
