@if (toastService.visible) {
    <div
        role="status"
        aria-live="polite"
        class="toast-slide-up fixed bottom-4 right-4 z-50 flex max-w-[calc(100vw-2rem)] items-center gap-3 rounded-2xl bg-neutral-900 px-4 py-3 text-white shadow-xl ring-1 ring-black/10 sm:bottom-6 sm:right-6 sm:px-5 sm:py-3.5">
        <span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[#708C69] text-white text-xs">
            <i class="fa-solid fa-check"></i>
        </span>
        <span class="text-xs font-medium sm:text-sm">{{ toastService.message }}</span>
    </div>
}
