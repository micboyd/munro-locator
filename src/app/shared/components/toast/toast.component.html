@if (toastService.visible) {
    <div
        role="status"
        aria-live="polite"
        class="toast-slide-up fixed bottom-6 right-6 z-50 flex items-center gap-3 rounded-2xl bg-neutral-900 px-5 py-3.5 text-white shadow-xl ring-1 ring-black/10">
        <span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-[#708C69] text-white text-xs">
            <i class="fa-solid fa-check"></i>
        </span>
        <span class="text-sm font-medium">{{ toastService.message }}</span>
    </div>
}
