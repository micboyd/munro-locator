<div class="flex space-x-1">
    @for (star of stars; track star) {
    <button
        type="button"
        [disabled]="readonly"
        class="text-xl cursor-pointer select-none transition-colors duration-150"
        (click)="setRating(star)">
        <i
            class="fa-solid fa-star-sharp"
            [ngClass]="star <= rating ? 'text-yellow-400' : 'text-gray-300'"></i>
    </button>
    }
</div>
